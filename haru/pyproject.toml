[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haru"
description = "Haru: a low-latency, multilingual, full-duplex speech language model"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "torch>=2.6",
    "transformers>=5.16",
    "tokenizers>=0.21",
    "safetensors>=0.4",
    "huggingface-hub>=0.26",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.13",
    "aiohttp>=3.10,<4",
    "sphn>=0.2,<0.3",
]

[project.optional-dependencies]
webrtc = ["aiortc==1.15.0", "av>=14"]
triton = ["triton>=3.2"]
share = ["gradio>=5"]
dev = ["pytest>=8"]

[project.scripts]
haru-server = "haru.server:main"
haru-inference = "haru.run_inference:main"

[tool.setuptools.dynamic]
version = { attr = "haru.__version__" }

[tool.setuptools.packages.find]
include = ["haru*"]

[tool.setuptools.package-data]
haru = ["assets/**/*", "static/**/*"]

[tool.setuptools.exclude-package-data]
haru = ["assets/voices/*"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a checkpoint; set HARU_MODEL to its directory or repository"]
