[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haru-speech-mlx"
description = "Haru on Apple silicon: the MLX implementation of the full-duplex spoken dialogue model"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "higurashi" }]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "mlx>=0.32",
    "tokenizers>=0.21",
    "huggingface-hub>=0.26",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.13",
]

[project.urls]
Homepage = "https://higurashi.ai"
Repository = "https://github.com/higurashi-ai/Haru"
Issues = "https://github.com/higurashi-ai/Haru/issues"
Model = "https://huggingface.co/higurashi-ai/Haru-4B"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
haru-mlx-inference = "haru_mlx.run_inference:main"
haru-mlx-native = "haru_mlx.native:main"

[tool.setuptools.dynamic]
version = { attr = "haru_mlx.__version__" }

[tool.setuptools.packages.find]
include = ["haru_mlx*"]

[tool.setuptools.package-data]
haru_mlx = ["assets/**/*"]

[tool.setuptools.exclude-package-data]
haru_mlx = ["assets/voices/*"]

[tool.ruff]
line-length = 120
