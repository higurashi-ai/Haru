[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haru_mlx"
description = "Haru on Apple silicon: the MLX implementation of the full-duplex speech language model"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "mlx>=0.32",
    "tokenizers>=0.21",
    "huggingface-hub>=0.26",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.13",
    "aiohttp>=3.10,<4",
    "sphn>=0.2,<0.3",
]

[project.optional-dependencies]
webrtc = ["aiortc==1.15.0", "av>=14"]
local = ["sounddevice>=0.5"]
dev = ["pytest>=8"]

[project.scripts]
haru-mlx-local = "haru_mlx.local:main"
haru-mlx-server = "haru_mlx.server:main"
haru-mlx-inference = "haru_mlx.run_inference:main"
haru-mlx-native = "haru_mlx.native:main"

[tool.setuptools.dynamic]
version = { attr = "haru_mlx.__version__" }

[tool.setuptools.packages.find]
include = ["haru_mlx*"]

[tool.setuptools.package-data]
haru_mlx = ["assets/**/*", "static/**/*"]

[tool.setuptools.exclude-package-data]
haru_mlx = ["assets/voices/*"]

[tool.ruff]
line-length = 120
