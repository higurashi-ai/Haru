[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haru-vllm"
description = "Serve Haru with vLLM-Omni"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["haru", "vllm>=0.33", "vllm-omni"]

# vLLM loads this group in the API server and in every engine worker.
[project.entry-points."vllm.general_plugins"]
haru = "haru_vllm:register"

[tool.setuptools.dynamic]
version = { attr = "haru_vllm.__version__" }

[tool.setuptools.packages.find]
include = ["haru_vllm*"]

[tool.setuptools.package-data]
haru_vllm = ["deploy/*.yaml"]
