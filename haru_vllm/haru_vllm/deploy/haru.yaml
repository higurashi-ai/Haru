# Haru full-duplex serving: one stage, one resumable request per conversation.
pipeline: haru
session_mode: duplex
duplex_session:
  max_sessions: 2
  # session.created echoes the voice reference (up to 180 s of audio).
  max_pending_output_bytes_per_session: 67108864
  # A short silent session at startup, before clients are admitted.
  warmup_frames: 8

async_chunk: false
dtype: bfloat16

stages:
  - stage_id: 0
    max_num_seqs: 2
    # 60 minutes of conversation (7.5 frames per second) plus the prompt: the
    # longest context the model was trained with.
    max_model_len: 32768
    # Cache for max_num_seqs conversations of max_model_len positions.
    kv_cache_memory_bytes: 8589934592  # 8 GiB
    skip_tokenizer_init: true
    # Prompt ids are placeholders; the real inputs are per-conversation embeddings.
    enable_prefix_caching: false
    # Every conversation appends one frame per step; synchronous scheduling
    # keeps all waiting frames in the same step.
    async_scheduling: false
    max_num_batched_tokens: 2048
    default_sampling_params:
      temperature: 0.7
      top_k: 25
      repetition_penalty: 1.0
      max_tokens: 1
